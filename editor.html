<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12141a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>Editor Schemi — Officina Elettrica</title><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}[hidden]{display:none!important}</style></head><body><meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: editor a tela libera — barra strumenti in alto, tavolozza a sinistra, foglio al centro */
:root{
  --bg:#e7e9ed; --panel:#f5f6f8; --card:#ffffff; --sheet:#fcfcfa; --inset:#eceef2; --hover:rgba(58,70,92,.08);
  --line:#cfd4dc; --grid:#e4e7ec; --sym:#222a36; --fg:#18202e; --muted:#5c6475;
  --accent:#c9740c; --accent-soft:rgba(201,116,12,.15); --sel:#1f7a4d; --sel-soft:rgba(31,122,77,.16);
  --wire:#222a36;
  --shadow:0 1px 2px rgba(20,28,45,.07),0 6px 18px rgba(20,28,45,.05);
  --ui:"Chivo",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101318; --panel:#161a21; --card:#1c212a; --sheet:#1a1f27; --inset:#13171d; --hover:rgba(200,215,240,.06);
  --line:#2b323d; --grid:#232a34; --sym:#cdd4e0; --fg:#e6eaf1; --muted:#8a93a3;
  --accent:#f0a83a; --accent-soft:rgba(240,168,58,.16); --sel:#2fd38a; --sel-soft:rgba(47,211,138,.16);
  --wire:#cdd4e0; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101318; --panel:#161a21; --card:#1c212a; --sheet:#1a1f27; --inset:#13171d; --hover:rgba(200,215,240,.06);
  --line:#2b323d; --grid:#232a34; --sym:#cdd4e0; --fg:#e6eaf1; --muted:#8a93a3;
  --accent:#f0a83a; --accent-soft:rgba(240,168,58,.16); --sel:#2fd38a; --sel-soft:rgba(47,211,138,.16);
  --wire:#cdd4e0; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation}
h1,h2{margin:0;font-weight:700}
button,input{font-family:inherit;color:inherit}
.mono{font-family:var(--mono)}

header{flex:none;background:var(--panel);border-bottom:1px solid var(--line);padding-block:9px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:6}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:32px;height:32px;flex:none;border-radius:8px;background:var(--sym);display:grid;place-items:center}
.brand h1{font-size:15px;white-space:nowrap}
.brand p{margin:0;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)} .btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default} .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.on{background:var(--accent);border-color:transparent;color:#2a1800}
.btn.ghost{background:transparent}
.btn svg{width:14px;height:14px}
.zoom{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.zoom button{border:0;background:none;padding:6px 10px;font-size:14px;font-weight:700;cursor:pointer;color:var(--fg)}
.zoom button:hover{background:var(--inset)} .zoom button+button{border-left:1px solid var(--line)}
.pal-toggle{display:none}

.work{flex:1;min-height:0;display:flex}
.palette{width:184px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow:auto;
  padding:12px 10px 40px 12px}
.palette h2{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px;font-weight:700}
.palette h2:first-child{margin-top:0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pitem{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 3px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.pitem:hover{border-color:var(--muted)}
.pitem.on{border-color:var(--accent);background:var(--accent-soft)}
.pitem svg{width:40px;height:40px}
.pitem svg *{stroke:var(--sym);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pitem svg .f{fill:var(--sym);stroke:none}
.pitem span{font-size:9.5px;color:var(--muted);line-height:1.15}

.stage{flex:1;min-width:0;overflow:auto;background:var(--inset);position:relative}
.sheetwrap{background:var(--sheet);box-shadow:var(--shadow);margin:24px}
svg.sheet{display:block}
svg.sheet .gl{stroke:var(--grid);stroke-width:1}
svg.sheet .gl0{stroke:color-mix(in srgb,var(--grid) 160%,transparent);stroke-width:1}
svg.sheet .sym{stroke:var(--sym);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.sheet .f{fill:var(--sym);stroke:none}
svg.sheet .term{fill:var(--sym);opacity:.55}
svg.sheet .wire{stroke:var(--wire);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.sheet .lab{fill:var(--fg);font-family:IBM Plex Mono,monospace;font-size:11px;font-weight:600}
svg.sheet .comp{cursor:grab}
svg.sheet .comp.sel .sym{stroke:var(--sel)} svg.sheet .comp.sel .f{fill:var(--sel)} svg.sheet .comp.sel .lab{fill:var(--sel)}
svg.sheet .wire.sel{stroke:var(--sel)}
svg.sheet .hit{fill:transparent}
svg.sheet.placing{cursor:crosshair} svg.sheet.wiring{cursor:crosshair}
svg.sheet .ghost{opacity:.5;pointer-events:none}
svg.sheet .draft{stroke:var(--accent);stroke-width:2.2;fill:none;stroke-dasharray:4 3;pointer-events:none}
svg.sheet .wire.live{stroke:#2fd38a;stroke-width:3}
svg.sheet .comp.live .term{fill:#2fd38a;opacity:1}
svg.sheet .comp.en .sym{stroke:#2fd38a}
svg.sheet .comp.en .f{fill:#2fd38a}
svg.sheet .lab.en{fill:#2fd38a}
svg.sheet.sim .comp.oper{cursor:pointer}
svg.sheet.sim .comp.oper .hit{fill:rgba(47,211,138,.05)}
.btn.simon{background:#2fd38a;border-color:transparent;color:#03271a}
.labedit{position:absolute;z-index:20;font-family:var(--mono);font-size:12px;font-weight:600;padding:2px 5px;
  border:1px solid var(--accent);border-radius:5px;background:var(--card);color:var(--fg);width:84px}

.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:5;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:12px;color:var(--muted);box-shadow:var(--shadow);
  white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}

.scrim{position:fixed;inset:0;background:rgba(9,13,20,.5);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(480px,100%);padding:20px}
.modal h2{font-size:16px;margin-bottom:4px}
.msub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field textarea{width:100%;font-family:var(--mono);font-size:12px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);resize:vertical}
.field input[type=file]{width:100%;font-size:13px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;padding:9px 14px;border-radius:10px;box-shadow:var(--shadow)}

@media (max-width:760px){
  .palette{position:absolute;z-index:8;height:100%;box-shadow:var(--shadow)}
  .palette[hidden]{display:none!important}
  .pal-toggle{display:inline-flex}
  .brand p{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#e3e9f2" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h4M4 7v10M16 7h4M20 7v10M8 12h3M13 12h3"/><circle cx="12" cy="12" r="1.6"/></svg></span>
    <div><h1>Editor Schemi Elettrici</h1><p>Disegna · sposta · collega</p></div>
  </div>
  <button class="btn pal-toggle" id="palToggle">Componenti</button>
  <button class="btn" id="toolSelect" title="Seleziona/sposta (V)">▚ Seleziona</button>
  <button class="btn" id="toolWire" title="Filo (W)">╱ Filo</button>
  <span style="width:1px;height:20px;background:var(--line)"></span>
  <button class="btn ghost" id="rotBtn" title="Ruota (R)">⟳</button>
  <button class="btn ghost" id="delBtn" title="Elimina (Canc)">🗑</button>
  <span style="width:1px;height:20px;background:var(--line)"></span>
  <button class="btn" id="simBtn">▶ Simula</button>
  <div class="zoom"><button id="zoomOut">−</button><button id="zoomFit" title="Adatta">⤢</button><button id="zoomIn">+</button></div>
  <button class="btn ghost" id="saveBtn">Salva / apri</button>
  <button class="btn ghost" id="clearBtn">Svuota</button>
</header>

<div class="work">
  <aside class="palette" id="palette"></aside>
  <div class="stage" id="stage">
    <div class="sheetwrap" id="sheetwrap"><svg class="sheet" id="svg"></svg></div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<div class="scrim" id="mSave" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="svTitle">
    <h2 id="svTitle">Salva / apri schema</h2>
    <p class="msub">Lo schema si salva da solo nel browser. Copia il testo per conservarlo, incollalo o scegli un file per riaprirlo.</p>
    <div class="field"><label for="svText">Schema (JSON)</label><textarea id="svText" rows="6" spellcheck="false"></textarea></div>
    <div class="field" style="margin-top:10px"><label for="svFile">Apri da file (formato editor)</label><input id="svFile" type="file" accept=".json,.txt,application/json,text/plain"></div>
    <div class="field" style="margin-top:10px"><label for="cadFile">Apri uno schema di CADe SIMU (.cad)</label><input id="cadFile" type="file" accept=".cad,.txt"></div>
    <div class="mact">
      <button class="btn ghost" id="svCopy">Copia</button>
      <button class="btn ghost" id="svLoad">Carica dal testo</button>
      <button class="btn" id="svClose">Chiudi</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";
(function(){
const $=s=>document.querySelector(s);
const U=16;                      // passo della griglia (px)
const COLS=96, ROWS=60;          // dimensione del foglio in celle
const W=COLS*U, H=ROWS*U;

// ---------- simboli (coordinate locali in px; origine = primo morsetto) ----------
const L=(a,b,c,d)=>`<line class="sym" x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`;
const C=(a,b,r)=>`<circle class="sym" cx="${a}" cy="${b}" r="${r}"/>`;
const R=(a,b,w,h)=>`<rect class="sym" x="${a}" y="${b}" width="${w}" height="${h}" rx="1"/>`;
const TXT=(a,b,t,s)=>`<text class="f" x="${a}" y="${b}" text-anchor="middle" font-size="${s||6}" font-family="IBM Plex Mono,monospace">${t}</text>`;
function contact(px,kind){ // verticale, altezza 2U; morsetti a (px,0) e (px,2U)
  const m=U, g=4; let o=L(px,0,px,m-g)+L(px,2*U,px,m+g)+L(px,m+g,px+6,m-g);
  if(kind==="nc") o+=L(px+6,m-g-1,px+6,m+2);
  if(kind==="km") o+=`<path class="sym" d="M${px-1} ${m+g} q3.5 2 6 -1.5"/>`;
  if(kind==="mt") o+=R(px-2.5,m+g+1,5,3.5);
  if(kind==="sw") o+=L(px-2,2*U,px+2.5,2*U);
  return o;
}
function act(){return L(6,U,11,U)+`<rect class="f" x="10.5" y="${U-2.5}" width="2" height="5"/>`;}
function mush(){return L(6,U,10,U)+`<path class="sym" d="M10 ${U-3.5} a3.5 3.5 0 0 1 0 7"/>`;}
function coilBox(t){return L(0,0,0,U-6)+L(0,U+6,0,2*U)+R(-6,U-6,12,12)+(t?TXT(0,U+2.5,t,6):"");}
function plcBox(t){return L(0,0,0,U-9)+L(0,U+9,0,2*U)+R(-10,U-9,20,18)+TXT(0,U+2.5,t,t.length>1?5:7);}
function pole(kind,n){let s="";for(let i=0;i<n;i++)s+=contact(i*U,kind);
  const y=kind==="sw"?2*U-2:U-4; s+=`<line class="sym" stroke-dasharray="1.5 2" x1="2" y1="${y}" x2="${(n-1)*U+2}" y2="${y}"/>`;return s;}
const SYM={
  no:()=>contact(0,"no"), nc:()=>contact(0,"nc"),
  pno:()=>contact(0,"no")+act(), pnc:()=>contact(0,"nc")+act(), pnoe:()=>contact(0,"no")+mush(),
  tno:()=>contact(0,"no")+`<path class="sym" d="M6 ${U-2} a4 4 0 0 1 0 4"/>`,
  coil:()=>coilBox(""), coilt:()=>coilBox("")+`<path class="sym" d="M-3 ${U} h6 M0 ${U} l2.5 -2"/>`,
  set:()=>coilBox("S"), reset:()=>coilBox("R"),
  lamp:()=>L(0,0,0,U-6)+L(0,U+6,0,2*U)+C(0,U,6)+L(-4.3,U-4.3,4.3,U+4.3)+L(-4.3,U+4.3,4.3,U-4.3),
  horn:()=>L(0,0,0,U-5)+`<path class="sym" d="M-6 ${U+5} a6 6 0 0 1 12 0 z"/>`,
  fuse:()=>L(0,0,0,2*U)+R(-3,U-7,6,14),
  res:()=>L(0,0,0,U-7)+L(0,U+7,0,2*U)+R(-3.5,U-7,7,14),
  edgep:()=>contact(0,"no")+TXT(3,U-2,"P",5), edgen:()=>contact(0,"nc")+TXT(3,U-2,"N",5),
  cnt:()=>L(0,0,0,U-8)+L(0,U+8,0,2*U)+R(-9,U-8,18,16)+TXT(0,U+2.5,"CTU",5),
  gstep:()=>L(0,0,0,U-7)+L(0,U+7,0,2*U)+R(-7,U-7,14,14),
  ginit:()=>L(0,0,0,U-7)+L(0,U+7,0,2*U)+R(-7,U-7,14,14)+R(-5,U-5,10,10),
  glink:()=>L(0,0,0,2*U)+L(-6,U,6,U),
  src:()=>L(0,0,0,U-7)+L(0,U+7,0,2*U)+C(0,U,7)+TXT(0,U+3,"~",8),
  plci:()=>plcBox("I"), plco:()=>plcBox("Q"), plccpu:()=>plcBox("CPU"),
  k3:()=>pole("km",3), k4:()=>pole("km",4), sez3:()=>pole("sw",3), mt3:()=>pole("mt",3)
    , diff3:()=>pole("mt",3)+C(2*U+9,U,2.3),
  motor:()=>L(0,0,U,24)+L(U,0,U,24)+L(2*U,0,U,24)+C(U,40,16)+TXT(U,43,"M",15)+TXT(U,53,"3~",7),
  transf:()=>L(0,0,0,10)+L(0,3*U-10,0,3*U)+`<path class="sym" d="M0 10 q6 3 0 6 q6 3 0 6 q6 3 0 6"/><path class="sym" d="M0 ${3*U-28} q-6 3 0 6 q-6 3 0 6 q-6 3 0 6"/>`
};
// definizione componenti: morsetti in unità di griglia, prefisso sigla
const DEF={
  src:{n:"Alimentazione L/N",g:"Alimentazione",t:[[0,0],[0,2]],p:""},
  no:{n:"Contatto NA",g:"Comando",t:[[0,0],[0,2]],p:"S"}, nc:{n:"Contatto NC",g:"Comando",t:[[0,0],[0,2]],p:"S"},
  pno:{n:"Pulsante NA",g:"Comando",t:[[0,0],[0,2]],p:"S"}, pnc:{n:"Pulsante NC",g:"Comando",t:[[0,0],[0,2]],p:"S"},
  pnoe:{n:"Puls. emergenza",g:"Comando",t:[[0,0],[0,2]],p:"S"}, tno:{n:"Contatto timer",g:"Comando",t:[[0,0],[0,2]],p:"KT"},
  coil:{n:"Bobina",g:"Comando",t:[[0,0],[0,2]],p:"KM"}, coilt:{n:"Bobina timer",g:"Comando",t:[[0,0],[0,2]],p:"KT"},
  lamp:{n:"Lampada",g:"Comando",t:[[0,0],[0,2]],p:"H"}, horn:{n:"Sirena",g:"Comando",t:[[0,0],[0,2]],p:"HA"},
  k3:{n:"Contattore 3P",g:"Potenza",t:[[0,0],[1,0],[2,0],[0,2],[1,2],[2,2]],p:"KM"},
  k4:{n:"Contattore 4P",g:"Potenza",t:[[0,0],[1,0],[2,0],[3,0],[0,2],[1,2],[2,2],[3,2]],p:"KM"},
  sez3:{n:"Sezionatore 3P",g:"Potenza",t:[[0,0],[1,0],[2,0],[0,2],[1,2],[2,2]],p:"QS"},
  mt3:{n:"Magnetotermico 3P",g:"Potenza",t:[[0,0],[1,0],[2,0],[0,2],[1,2],[2,2]],p:"Q"},
  diff3:{n:"Differenziale 3P",g:"Potenza",t:[[0,0],[1,0],[2,0],[0,2],[1,2],[2,2]],p:"FD"},
  fuse:{n:"Fusibile",g:"Potenza",t:[[0,0],[0,2]],p:"F"}, res:{n:"Resistenza",g:"Potenza",t:[[0,0],[0,2]],p:"R"},
  motor:{n:"Motore 3~",g:"Potenza",t:[[0,0],[1,0],[2,0]],p:"M"}, transf:{n:"Trasformatore",g:"Potenza",t:[[0,0],[0,3]],p:"T"},
  edgep:{n:"Fronte salita",g:"Logica",t:[[0,0],[0,2]],p:"S"}, edgen:{n:"Fronte discesa",g:"Logica",t:[[0,0],[0,2]],p:"S"},
  set:{n:"Set",g:"Logica",t:[[0,0],[0,2]],p:"M"}, reset:{n:"Reset",g:"Logica",t:[[0,0],[0,2]],p:"M"},
  cnt:{n:"Contatore",g:"Logica",t:[[0,0],[0,2]],p:"C"},
  gstep:{n:"Passo GRAFCET",g:"GRAFCET",t:[[0,0],[0,2]],p:"X"}, ginit:{n:"Passo iniziale",g:"GRAFCET",t:[[0,0],[0,2]],p:"X"},
  glink:{n:"Transizione",g:"GRAFCET",t:[[0,0],[0,2]],p:"T"},
  plci:{n:"Ingresso PLC",g:"PLC",t:[[0,0],[0,2]],p:"I"}, plco:{n:"Uscita PLC",g:"PLC",t:[[0,0],[0,2]],p:"Q"},
  plccpu:{n:"CPU PLC",g:"PLC",t:[[0,0],[0,2]],p:"CPU"}
};
const ORDER=Object.keys(DEF);
// riquadro locale (per selezione) per tipo, calcolato dai morsetti
function localBox(t){
  const ts=DEF[t].t, gx=Math.max(...ts.map(p=>p[0])), gy=Math.max(...ts.map(p=>p[1]));
  if(t==="motor") return {x:-18,y:-6,w:gx*U+36,h:70};
  return {x:-11,y:-4,w:gx*U+22,h:gy*U+8};
}

// ---------- stato ----------
let prog={comps:[],wires:[],seq:{}};
let tool="select", placeType=null, sel=null, zoom=1;
let drag=null, draft=null, hoverPt=null;
const KEY="cade_editor_v1";

function nextLabel(t){const p=DEF[t].p;prog.seq[p]=(prog.seq[p]||0)+1;return p+prog.seq[p];}
function save(){try{localStorage.setItem(KEY,JSON.stringify(prog));}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(d&&Array.isArray(d.comps)){prog=normalize(d);return true;}}}catch(e){}return false;}
function normalize(d){
  const p={comps:[],wires:[],seq:{}};
  (d.comps||[]).forEach(c=>{if(DEF[c.t])p.comps.push({id:c.id||uid(),t:c.t,x:Math.round((+c.x||0)/U)*U,y:Math.round((+c.y||0)/U)*U,rot:((+c.rot||0)%360+360)%360,lab:String(c.lab||"")});});
  (d.wires||[]).forEach(w=>{if(Array.isArray(w.pts)&&w.pts.length>=2)p.wires.push({id:w.id||uid(),pts:w.pts.map(pt=>[Math.round(pt[0]/U)*U,Math.round(pt[1]/U)*U])});});
  // ricostruisci i contatori delle sigle
  p.comps.forEach(c=>{const m=/^([A-Za-z]+)(\d+)$/.exec(c.lab||"");if(m){const pre=m[1],n=+m[2];p.seq[pre]=Math.max(p.seq[pre]||0,n);}});
  return p;
}
let _id=1; function uid(){return "e"+(_id++)+"_"+Math.random().toString(36).slice(2,6);}

// ---------- geometria ----------
function rot(px,py,deg){const r=deg*Math.PI/180,c=Math.cos(r),s=Math.sin(r);return [px*c-py*s, px*s+py*c];}
function compTerms(c){return DEF[c.t].t.map(([gx,gy])=>{const [rx,ry]=rot(gx*U,gy*U,c.rot);return [c.x+rx,c.y+ry];});}
function compBoxWorld(c){ // bbox approssimato in coordinate mondo
  const b=localBox(c.t), pts=[[b.x,b.y],[b.x+b.w,b.y],[b.x,b.y+b.h],[b.x+b.w,b.y+b.h]].map(([x,y])=>{const[rx,ry]=rot(x,y,c.rot);return[c.x+rx,c.y+ry];});
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  return {x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};
}
function labelPos(c){ // posizione sigla, in mondo, verticale costante
  const b=localBox(c.t); const [rx,ry]=rot(b.x+b.w+3, b.y+b.h/2, c.rot);
  return [c.x+rx, c.y+ry];
}

// ---------- disegno ----------
const svg=$("#svg"), sheetwrap=$("#sheetwrap");
function setZoom(z){zoom=Math.max(.35,Math.min(2.5,z));svg.setAttribute("width",(W*zoom).toFixed(0));svg.setAttribute("height",(H*zoom).toFixed(0));svg.setAttribute("viewBox",`0 0 ${W} ${H}`);}
function render(){
  if(sim) solveNow();
  let g="";
  g+=`<rect x="0" y="0" width="${W}" height="${H}" fill="var(--sheet)"/>`;
  for(let x=0;x<=COLS;x++) g+=`<line class="${x%5?'gl':'gl0'}" x1="${x*U}" y1="0" x2="${x*U}" y2="${H}"/>`;
  for(let y=0;y<=ROWS;y++) g+=`<line class="${y%5?'gl':'gl0'}" x1="0" y1="${y*U}" x2="${W}" y2="${y*U}"/>`;
  for(const w of prog.wires){const live=sim&&sim.liveWire&&sim.liveWire.has(w.id);
    g+=`<polyline class="wire${live?' live':''}${sel&&sel.k==='w'&&sel.id===w.id?' sel':''}" data-w="${w.id}" points="${w.pts.map(p=>p.join(',')).join(' ')}"/>`;}
  for(const c of prog.comps){
    const live=sim&&sim.liveComp&&sim.liveComp.has(c.id), en=sim&&sim.enComp&&sim.enComp.has(c.id), oper=sim&&sim.operIds&&sim.operIds.has(c.id);
    g+=`<g class="comp${live?' live':''}${en?' en':''}${oper?' oper':''}${sel&&sel.k==='c'&&sel.id===c.id?' sel':''}" data-c="${c.id}" transform="translate(${c.x},${c.y}) rotate(${c.rot})">`;
    g+=SYM[c.t]();
    for(const [gx,gy] of DEF[c.t].t) g+=`<circle class="term" cx="${gx*U}" cy="${gy*U}" r="1.7"/>`;
    const b=localBox(c.t); g+=`<rect class="hit" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>`;
    g+=`</g>`;
    if(c.lab){const [lx,ly]=labelPos(c); g+=`<text class="lab${en?' en':''}${sel&&sel.k==='c'&&sel.id===c.id?' sel':''}" x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}">${esc(c.lab)}</text>`;}
  }
  if(draft&&draft.pts.length){ const pts=draft.pts.slice(); if(hoverPt)pts.push(hoverPt); g+=`<polyline class="draft" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
    draft.pts.forEach(p=>g+=`<circle class="f" cx="${p[0]}" cy="${p[1]}" r="2"/>`); }
  svg.innerHTML=g;
  svg.classList.toggle("sim",!!sim);
  if(!sim)save();
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// ---------- coordinate mouse -> foglio (snap) ----------
function evtPt(e){const r=svg.getBoundingClientRect();const x=(e.clientX-r.left)/zoom,y=(e.clientY-r.top)/zoom;return [x,y];}
function snap(x,y){return [Math.round(x/U)*U,Math.round(y/U)*U];}

// ---------- hit test ----------
function compAt(x,y){
  for(let i=prog.comps.length-1;i>=0;i--){const c=prog.comps[i],b=compBoxWorld(c);
    if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h) return c;}
  return null;
}

// ---------- tavolozza ----------
function buildPalette(){
  const grps={}; ORDER.forEach(t=>{(grps[DEF[t].g]=grps[DEF[t].g]||[]).push(t);});
  let h="";
  for(const gname in grps){
    h+=`<h2>${gname}</h2><div class="pgrid">`;
    for(const t of grps[gname]){
      h+=`<button class="pitem" data-t="${t}" title="${DEF[t].n}"><svg viewBox="-20 -8 ${localBox(t).w+8} ${localBox(t).h+10}">${SYM[t]()}</svg><span>${DEF[t].n}</span></button>`;
    }
    h+="</div>";
  }
  $("#palette").innerHTML=h;
}

// ---------- strumenti ----------
function setTool(t,pt){

function updateHint(){
  const h=$("#hint");

// ---------- interazione mouse ----------
svg.addEventListener("pointerdown",e=>{
  if(e.button!==0)return;
  if(sim){ simDown(e); return; }
  const [mx,my]=evtPt(e), [sx,sy]=snap(mx,my);
  if(tool==="place"){
    const c={id:uid(),t:placeType,x:sx,y:sy,rot:0,lab:placeType==="src"?"L / N":nextLabel(placeType)};
    prog.comps.push(c); sel={k:"c",id:c.id}; render();
    return;
  }
  if(tool==="wire"){
    if(!draft){draft={pts:[[sx,sy]]};}
    else{
      const last=draft.pts[draft.pts.length-1];
      if(last[0]===sx&&last[1]===sy){ if(draft.pts.length>=2)prog.wires.push({id:uid(),pts:draft.pts}); draft=null; }
      else draft.pts.push([sx,sy]);
    }
    hoverPt=[sx,sy]; render(); updateHint(); return;
  }
  // select
  const hitW=e.target.closest("[data-w]");
  const c=compAt(mx,my);
  if(c){ sel={k:"c",id:c.id}; drag={id:c.id,ox:mx,oy:my,sx:c.x,sy:c.y,moved:false}; svg.setPointerCapture(e.pointerId); }
  else if(hitW){ sel={k:"w",id:hitW.dataset.w}; drag=null; }
  else { sel=null; drag=null; }
  render(); updateHint();
});
svg.addEventListener("pointermove",e=>{
  const [mx,my]=evtPt(e);
  if(tool==="wire"&&draft){ hoverPt=snap(mx,my)[0]!==undefined?snap(mx,my):null; hoverPt=snap(mx,my); render(); return; }
  if(drag){ const c=prog.comps.find(k=>k.id===drag.id); if(!c)return;
    const [nx,ny]=snap(drag.sx+(mx-drag.ox), drag.sy+(my-drag.oy));
    if(nx!==c.x||ny!==c.y){c.x=nx;c.y=ny;drag.moved=true;render();} }
});
function endDrag(e){ if(sim){ if(sim._release){sim.press[sim._release]=false;sim._release=null;render();} return; } if(drag){try{svg.releasePointerCapture(e.pointerId);}catch(_){} drag=null;} }
svg.addEventListener("pointerup",endDrag);

svg.addEventListener("dblclick",e=>{
  if(tool==="wire"&&draft){ if(draft.pts.length>=2)prog.wires.push({id:uid(),pts:draft.pts}); draft=null; render(); updateHint(); return; }

});

document.addEventListener("keydown",e=>{

// ---------- importa un file .cad di CADe SIMU ----------
const CADEMAP={
 1000:"motor",1003:"motor",1004:"motor",1005:"motor",1006:"motor",1007:"motor",1050:"res",1051:"res",1052:"transf",3012:"transf",3013:"transf",
 2000:"k3",2001:"k3",2002:"k4",2006:"k3",2003:"k3",2004:"sez3",2005:"k4",2007:"k3",
 5000:"fuse",5001:"fuse",5002:"fuse",5003:"fuse",5004:"fuse",6002:"fuse",5005:"sez3",5006:"sez3",5007:"sez3",5008:"sez3",5009:"sez3",
 6005:"mt3",6006:"mt3",6008:"mt3",6009:"mt3",6010:"mt3",6015:"mt3",6018:"diff3",6019:"sez3",6020:"sez3",
 7000:"no",7001:"nc",7002:"no",7003:"no",7004:"tno",7018:"no",7019:"no",7020:"tno",7021:"nc",
 8000:"pno",8001:"pnc",8002:"pno",8003:"pno",8004:"pnoe",8005:"pnc",8006:"pnoe",8007:"pno",8008:"no",8009:"nc",8010:"no",8011:"no",8012:"no",8013:"nc",8014:"no",8015:"no",8016:"no",8100:"pno",8101:"lamp",
 9000:"coil",9001:"coil",9002:"coil",9004:"coilt",9007:"coilt",9009:"lamp",9010:"horn",9011:"horn",9012:"horn",9013:"horn",9016:"cnt",
 10050:"no",10051:"nc",10052:"edgep",10053:"edgen",10060:"coil",10061:"set",10062:"reset",10063:"cnt",10075:"cnt",
 10100:"ginit",10101:"gstep",10111:"gstep",10107:"glink",10108:"glink",10112:"glink",10204:"plci",10205:"plco",10206:"plccpu",10207:"plci",10208:"plci"
};
const CADWIRE=new Set([4000,4001,4002,4003,4004,4009,4010,4018,4019]);
function parseCad(text){
  if(!/^CADe_SIMU/.test(text)) throw new Error("Non sembra un file di CADe SIMU");
  const body=text.split("$$$")[0], toks=body.split(/(?=\*\d+\*\d+#)/), comps=[],wires=[];
  for(const t of toks){
    const m=/^\*(\d+)\*(\d+)#([\s\S]*)$/.exec(t); if(!m)continue;
    const type=+m[2],rest=m[3], sig=rest.split("#")[0].replace(/^-/,"");
    const parts=rest.split("*"),nums=[];
    for(let i=1;i<parts.length;i++){const v=parts[i].split("#")[0];nums.push(/^-?\d+$/.test(v)?parseInt(v,10):null);}
    if(CADWIRE.has(type)){ if(nums.length>=12&&nums[8]!=null)wires.push([nums[8],nums[9],nums[10],nums[11]]); }
    else if(type!==3005&&type!==20000){ if(nums.length>=10&&nums[8]!=null)comps.push({type,sig,x:nums[8],y:nums[9]}); }
  }
  return {comps,wires};
}
function importCad(text){
  let d; try{d=parseCad(text);}catch(e){toast(e.message||"File non valido");return false;}
  const S=p=>Math.round(p/6)*U;      // 6 unità CADe SIMU ≈ 1 cella dell'editor
  const np={comps:[],wires:[],seq:{}};
  let skipped=0;
  for(const c of d.comps){const t=CADEMAP[c.type]; if(!t){skipped++;continue;} np.comps.push({id:uid(),t,x:S(c.x),y:S(c.y),rot:0,lab:c.sig||""});}
  for(const w of d.wires) np.wires.push({id:uid(),pts:[[S(w[0]),S(w[1])],[S(w[2]),S(w[3])]]});
  np.comps.forEach(c=>{const m=/^([A-Za-z]+)(\d+)$/.exec(c.lab||"");if(m)np.seq[m[1]]=Math.max(np.seq[m[1]]||0,+m[2]);});
  if(!np.comps.length&&!np.wires.length){toast("Nessun elemento riconosciuto nel file");return false;}
  prog=np; sel=null; render();
  toast("Schema importato"+(skipped?` (${skipped} elementi avanzati non convertiti)`:"")+" — ora modificabile");
  return true;
}
$("#cadFile").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{if(importCad(String(rd.result)))mSave.hidden=true;};rd.readAsText(f,"latin1");e.target.value="";});
let toastT; function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200);}

// ---------- SIMULAZIONE ----------
let sim=null, simTimer=null;
function buildNetlist(){
  const parent={}; const find=k=>{while(parent[k]!==k){parent[k]=parent[parent[k]];k=parent[k];}return k;};
  const union=(a,b)=>{a=find(a);b=find(b);if(a!==b)parent[a]=b;}; const add=k=>{if(!(k in parent))parent[k]=k;};
  const terms=[];
  prog.comps.forEach(c=>compTerms(c).forEach((pt,i)=>{const k=c.id+":"+i;add(k);terms.push({key:k,pt});}));
  prog.wires.forEach((w,wi)=>add("w"+wi));
  const onSeg=(p,a,b)=>{const cr=(b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]); if(Math.abs(cr)>1)return false;
    return p[0]>=Math.min(a[0],b[0])-1&&p[0]<=Math.max(a[0],b[0])+1&&p[1]>=Math.min(a[1],b[1])-1&&p[1]<=Math.max(a[1],b[1])+1;};
  const wireHas=(w,p)=>{for(let s=0;s<w.pts.length-1;s++)if(onSeg(p,w.pts[s],w.pts[s+1]))return true;return false;};
  for(let i=0;i<prog.wires.length;i++)for(let j=i+1;j<prog.wires.length;j++){const A=prog.wires[i],B=prog.wires[j];
    if(A.pts.some(p=>wireHas(B,p))||B.pts.some(p=>wireHas(A,p)))union("w"+i,"w"+j);}
  terms.forEach(t=>prog.wires.forEach((w,wi)=>{if(wireHas(w,t.pt))union(t.key,"w"+wi);}));
  for(let i=0;i<terms.length;i++)for(let j=i+1;j<terms.length;j++) if(terms[i].pt[0]===terms[j].pt[0]&&terms[i].pt[1]===terms[j].pt[1])union(terms[i].key,terms[j].key);
  return {find};
}
function solveNow(){
  const nl=buildNetlist(), rootOf=(c,i)=>nl.find(c.id+":"+i);
  let Lr=null,Nr=null; prog.comps.forEach(c=>{if(c.t==="src"){Lr=rootOf(c,0);Nr=rootOf(c,1);}});
  const coilLabs=new Set(),timerLabs=new Set();
  prog.comps.forEach(c=>{if(["coil","set","reset"].includes(c.t)&&c.lab)coilLabs.add(c.lab); if(c.t==="coilt"&&c.lab){coilLabs.add(c.lab);timerLabs.add(c.lab);}});
  sim.ctrlLabs=coilLabs;
  const coils=sim.coils||{};
  const ctrlOn=lab=>{ if(timerLabs.has(lab))return !!sim.timerOut[lab]; if(coilLabs.has(lab))return !!coils[lab]; return null; };
  const operIds=new Set();
  const contactCond=c=>{const t=c.t;
    if(t==="pno"||t==="pnoe"){operIds.add(c.id);return !!sim.press[c.id];}
    if(t==="pnc"){operIds.add(c.id);return !sim.press[c.id];}
    const on=ctrlOn(c.lab);
    if(on===null){operIds.add(c.id);const def=(t==="nc"||t==="edgen");return sim.manual[c.id]!==undefined?sim.manual[c.id]:def;}
    return (t==="nc"||t==="edgen")?!on:on;};
  const poleCond=c=>{const on=ctrlOn(c.lab); if(on!==null)return on; operIds.add(c.id);
    const br=["mt3","diff3","sez3"].includes(c.t); return sim.manual[c.id]!==undefined?sim.manual[c.id]:br;};
  let f=null;
  for(let it=0;it<50;it++){
    const par={}; const ff=k=>{if(!(k in par))return k; while(par[k]!==k){par[k]=par[par[k]];k=par[k];}return k;};
    const u=(a,b)=>{a=ff(a);b=ff(b);if(a!==b)par[a]=b;}; const an=k=>{if(!(k in par))par[k]=k;};
    prog.comps.forEach(c=>compTerms(c).forEach((p,i)=>an(rootOf(c,i))));
    if(Lr!=null)an(Lr); if(Nr!=null)an(Nr);
    prog.comps.forEach(c=>{const t=c.t;
      if(t==="fuse"||t==="res")u(rootOf(c,0),rootOf(c,1));
      else if(["no","nc","pno","pnc","pnoe","tno","edgep","edgen"].includes(t)){ if(contactCond(c))u(rootOf(c,0),rootOf(c,1)); }
      else if(["k3","k4","sez3","mt3","diff3"].includes(t)){ const np=DEF[t].t.length/2; if(poleCond(c))for(let p=0;p<np;p++)u(rootOf(c,p),rootOf(c,np+p)); }
    });
    const isLN=(a,b)=>Lr!=null&&Nr!=null&&((ff(a)===ff(Lr)&&ff(b)===ff(Nr))||(ff(a)===ff(Nr)&&ff(b)===ff(Lr)));
    const nc=Object.assign({},coils); let changed=false;
    prog.comps.forEach(c=>{
      if(["coil","set","reset","lamp","horn","cnt"].includes(c.t)){ const en=isLN(rootOf(c,0),rootOf(c,1)); c._en=en;
        if(c.t==="coil"&&c.lab){if(!!nc[c.lab]!==en)changed=true; nc[c.lab]=en;}
        if(c.t==="set"&&c.lab&&en){if(!nc[c.lab])changed=true; nc[c.lab]=true;}
        if(c.t==="reset"&&c.lab&&en){if(nc[c.lab])changed=true; nc[c.lab]=false;}
      } else if(c.t==="coilt"){c._inp=isLN(rootOf(c,0),rootOf(c,1)); c._en=!!sim.timerOut[c.lab];}
      else if(c.t==="motor"){let lv=0;for(let i=0;i<3;i++)if(Lr!=null&&ff(rootOf(c,i))===ff(Lr))lv++; c._en=lv>=2;}
    });
    Object.keys(nc).forEach(k=>{if(!!coils[k]!==!!nc[k])changed=true;});
    sim.coils=Object.assign(coils,nc); f=ff;
    if(!changed) break;
  }
  sim.operIds=operIds;
  const liveWire=new Set(),liveComp=new Set(),enComp=new Set();
  if(Lr!=null&&f){ const Lf=f(Lr);
    prog.wires.forEach((w,wi)=>{ if(f(nl.find("w"+wi))===Lf)liveWire.add(w.id); });
    prog.comps.forEach(c=>{let a=false; compTerms(c).forEach((p,i)=>{if(f(rootOf(c,i))===Lf)a=true;}); if(a)liveComp.add(c.id); if(c._en)enComp.add(c.id);});
  }
  sim.liveWire=liveWire; sim.liveComp=liveComp; sim.enComp=enComp;
}
function startSim(){
  if(!prog.comps.some(c=>c.t==="src")){toast("Metti un'«Alimentazione» (prima voce della tavolozza) per simulare");return;}
  closeLabelEdit(); setTool("select"); sel=null; draft=null;
  sim={press:{},manual:{},coils:{},timerAcc:{},timerOut:{}};
  const b=$("#simBtn"); b.textContent="■ Ferma"; b.classList.add("simon");
  render(); simTimer=setInterval(simTick,120); updateHint();
}
function stopSim(){ if(simTimer)clearInterval(simTimer); simTimer=null; sim=null; const b=$("#simBtn"); b.textContent="▶ Simula"; b.classList.remove("simon"); render(); updateHint(); }
function simTick(){
  prog.comps.forEach(c=>{ if(c.t==="coilt"&&c.lab){ const pre=3; if(c._inp){sim.timerAcc[c.lab]=Math.min(pre,(sim.timerAcc[c.lab]||0)+0.12);}else{sim.timerAcc[c.lab]=0;} sim.timerOut[c.lab]=(sim.timerAcc[c.lab]||0)>=pre; } });
  render();
}
function simDown(e){ const [mx,my]=evtPt(e); const c=compAt(mx,my); if(!c)return;
  if(["pno","pnc","pnoe"].includes(c.t)){ sim.press[c.id]=true; sim._release=c.id; render(); }
  else if(sim.operIds&&sim.operIds.has(c.id)){ const br=["mt3","diff3","sez3","nc","edgen"].includes(c.t); const cur=sim.manual[c.id]!==undefined?sim.manual[c.id]:br; sim.manual[c.id]=!cur; render(); }
}
$("#simBtn").addEventListener("click",()=>sim?stopSim():startSim());

// ---------- avvio ----------
buildPalette();
if(!load()){ prog={comps:[],wires:[],seq:{}}; }
setTool("select");
setZoom(1); render(); updateHint();
})();
</script>
